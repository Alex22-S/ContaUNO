<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - ContaUNO</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <div class="floating-elements" id="floatingElements"></div>
    <header class="header">
        <nav class="nav">
            <div class="logo">ContaUNO</div>
            <div class="nav-links">
                <div class="theme-switcher">
                    <input type="checkbox" id="theme-toggle">
                    <label for="theme-toggle">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                    </label>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1 class="login-title">Crear Cuenta</h1>
            <p class="login-subtitle">Únete a ContaUNO para gestionar tu contabilidad</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-username">Tu Nombre (o el de tu negocio)</label>
                    <input type="text" id="signup-username" required>
                </div>
                 <div class="form-group">
                    <label for="signup-email">Correo Electrónico</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Contraseña</label>
                    <input type="password" id="signup-password" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="signup-password-confirm">Confirmar Contraseña</label>
                    <input type="password" id="signup-password-confirm" required>
                </div>
                
                <p id="signup-error" class="error-message"></p>
                
                <div class="divider">
                    <span>o regístrate con</span>
                </div>
                
                <div class="social-buttons-container">
                    <button id="google-signup-btn" class="social-login-btn google">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
                        Google
                    </button>
                    <button id="facebook-signup-btn" class="social-login-btn facebook">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo">
                        Facebook
                    </button>
                </div>

                <button type="submit" class="login-btn">Registrarse con Correo</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="JS/firebase-config.js"></script>
    <script src="JS/signup.js"></script>
</body>
</html>
