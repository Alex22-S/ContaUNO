<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil - ContaUNO</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <div class="floating-elements" id="floatingElements"></div>
    <header class="header">
        <nav class="nav">
            <div class="logo">ContaUNO</div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1 class="login-title">¡Bienvenido/a!</h1>
            <p class="login-subtitle">Cuéntanos un poco más sobre ti para personalizar tu experiencia.</p>
            
            <form id="profile-form">
                <div class="form-group">
                    <label>¿Cómo usarás ContaUNO?</label>
                    <div class="segmented-control">
                        <input type="radio" id="type-personal" name="account-type" value="personal" checked>
                        <label for="type-personal">👤 Uso Personal</label>
                        <input type="radio" id="type-business" name="account-type" value="business">
                        <label for="type-business">🏢 Mi Negocio</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone-number">Número de Teléfono (Opcional)</label>
                    <input type="tel" id="phone-number" placeholder="Ej: 3001234567">
                </div>

                <div id="business-fields" class="hidden">
                    <div class="form-group">
                        <label for="business-name">Nombre del Negocio</label>
                        <input type="text" id="business-name" placeholder="Ej: Mi Tienda S.A.S.">
                    </div>
                    <div class="form-group">
                        <label for="business-id">NIT / Identificación del Negocio (Opcional)</label>
                        <input type="text" id="business-id" placeholder="Ej: 900.123.456-7">
                    </div>
                </div>
                
                <p id="profile-error" class="error-message"></p>
                <button type="submit" class="login-btn">Guardar y Empezar</button>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="JS/firebase-config.js"></script>
    <script src="JS/profile-completion.js"></script>
</body>
</html>
